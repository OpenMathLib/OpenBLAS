name: rdna2 level-3 bridge test

# Builds the library and runs gpu/rdna2/test_oblas_gpu.c, which checks the CBLAS
# level-3 entry points the rdna2 bridges serve -- SGEMM, SYMM, SYRK, SYR2K, TRMM
# and TRSM -- against double-precision references the test computes itself. It
# covers every order/side/uplo/trans/diag combination, alpha and beta including
# zero, negative and large values, and the contracts the bridges owe the caller:
# the triangle they were not asked to store, the stored diagonal of a
# unit-diagonal factor and the ldb/ldc padding have to come back untouched.
# The per-op comparisons treat a non-finite result as a failure instead of
# letting it past a tolerance test that is always false for NaN. Nothing here
# needs a GPU: on a CPU-only build the same cases still check the values and
# those contracts. The dispatch itself is only exercised by a build made with
# USE_HIP=1 on a machine with an AMD card, which hosted runners do not have --
# the "gpu" job at the bottom is the place to add that on a self-hosted runner.
#
# Two gaps are written down here rather than left implicit. No case feeds a NaN
# or an infinity into an input yet, so the non-finite handling above guards a
# result that arithmetic produced; it is not a tested scenario, and the SGEMM
# block still judges by max |diff| alone, where a NaN result passes silently.
# The path filters below also omit interface/symm.c, interface/trsm.c (TRMM and
# TRSM) and interface/gemm.c, so an edit to one of those bridge files does not
# start this workflow on its own.

on:
  push:
    paths:
      - 'gpu/rdna2/**'
      - 'kernel/rdna2/**'
      - 'interface/syrk.c'
      - 'interface/syr2k.c'
      - 'interface/gemm_i8.c'
      - 'cblas.h'
      - 'Makefile'
      - 'Makefile.system'
      - 'Makefile.rule'
      - '.github/workflows/rdna2_level3.yml'
  pull_request:
    paths:
      - 'gpu/rdna2/**'
      - 'kernel/rdna2/**'
      - 'interface/syrk.c'
      - 'interface/syr2k.c'
      - 'interface/gemm_i8.c'
      - 'cblas.h'
      - 'Makefile'
      - 'Makefile.system'
      - 'Makefile.rule'
      - '.github/workflows/rdna2_level3.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: bridge test (linux, CPU build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran

      # NOFORTRAN/NO_LAPACK keep the job to what the bridge test needs: CBLAS
      # level-3 entry points and the kernels behind them.
      - name: Build library
        run: make -j"$(nproc)" NOFORTRAN=1 NO_LAPACK=1 NO_LAPACKE=1 libs

      - name: Level-3 bridge test
        run: make NOFORTRAN=1 NO_LAPACK=1 NO_LAPACKE=1 level3-test

  windows:
    name: bridge test (windows, CPU build)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            base-devel
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Build library
        run: make -j"$(nproc)" CC=gcc NOFORTRAN=1 NO_LAPACK=1 NO_LAPACKE=1 libs

      - name: Level-3 bridge test
        run: make CC=gcc NOFORTRAN=1 NO_LAPACK=1 NO_LAPACKE=1 level3-test

  # Device coverage needs an AMD GPU and a ROCm install, which GitHub-hosted
  # runners do not provide. On a self-hosted runner carrying one, this job is
  # the same two commands with the HIP build switched on:
  #
  # gpu:
  #   name: bridge test (self-hosted, USE_HIP)
  #   runs-on: [self-hosted, gpu, rocm]
  #   steps:
  #     - uses: actions/checkout@v5
  #     - name: Build library with the device kernels
  #       run: |
  #         make clean
  #         make -j"$(nproc)" USE_HIP=1 GPU_ARCH=gfx1201 libs
  #     - name: Level-3 bridge test (asserts the dispatch actually fires)
  #       run: |
  #         make USE_HIP=1 GPU_ARCH=gfx1201 level3-test
  #         make -C gpu/rdna2 oblas-test OPENBLAS_RDNA2_GPU_DEBUG=1 2>&1 | tee gpu.log
  #         grep -q 'handled=1' gpu.log
