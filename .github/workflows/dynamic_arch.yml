                -DCPP_THREAD_SAFETY_DGEMM_MIXED_ARGS="524288;16;20" \
                -DCPP_THREAD_SAFETY_DGEMV_ARGS="384;8;4" \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
